name = "nonmonic_cubic"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["NonmonicCubic"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # this project is not a Mathlib PR; skip the copyright-header lint
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "NonmonicCubic"
